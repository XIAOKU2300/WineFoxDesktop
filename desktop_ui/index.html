<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>WineFox Desktop</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>
  <div class="warmup-root" id="warmup-root" role="status" aria-live="polite">
    <div class="warmup-art" aria-hidden="true">
      <svg viewBox="0 0 260 156">
        <circle class="moon" cx="194" cy="38" r="19"/>
        <path class="mountain far" d="M18 116c26-35 58-48 86-19 25-29 63-25 94 18"/>
        <path class="mountain near" d="M8 130c42-16 76-16 105-2 36-17 84-15 139 2"/>
        <path class="tail" d="M32 123c42-2 63-24 67-49 3-18-11-29-26-21-18 9-10 34 9 43 31 15 68-1 91-24"/>
        <path class="horizon" d="M16 137h228"/>
      </svg>
      <span class="warmup-seal">狐</span>
    </div>
    <p>正在铺开创作界面</p>
  </div>
  <a class="skip-link" href="#main">跳到主内容</a>

  <!-- ===== 向导（首次运行，由 JS 注入内容） ===== -->
  <!-- ===== 应用外壳 ===== -->
  <div id="app-root" class="app" hidden>
    <header class="topbar" role="banner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M4 13c0-5 3.5-9 10-9s10 4 10 9c0 6.5-5 12-10 12S4 19.5 4 13Z" stroke-width="1.6"/>
          <path d="M7.5 9.5c1.2-.6 2.6-1.2 3.7-2.6M20.5 9.5c-1.2-.6-2.6-1.2-3.7-2.6" stroke-width="1.2"/>
          <path d="M9.2 13.8c1.6 1.4 3.4 1.4 4.8.2 1.4 1.2 3.2 1.2 4.8-.2" stroke-width="1.5"/>
          <path d="M13 16.4v1.6" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="brand-name">Wine<em>Fox</em> Desktop</div>
          <div class="brand-sub">ComfyUI Pro · 酒狐桌面端</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div id="conn-status" class="conn" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span class="conn-text">正在检测连接…</span>
      </div>
      <button id="conn-retry" class="btn btn-icon conn-retry" type="button" title="重新检测 ComfyUI 连接" aria-label="重新检测 ComfyUI 连接">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.2 5.8A5.6 5.6 0 1 0 13 10.7" stroke-width="1.45" stroke-linecap="round"/>
          <path d="M10.8 3.2h2.8V6" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-sep" aria-hidden="true"></div>
      <button id="theme-toggle" class="btn btn-icon" type="button" title="切换深色/浅色主题 (T)" aria-label="切换深色/浅色主题">
        <svg id="ico-theme" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 0 5.2 7 4.2 4.2 0 0 1-5.2-5.2 5.5 5.5 0 0 0 0-1.8ZM12 12.5h.01" stroke-width="1.4"/></svg>
      </button>
    </header>

    <div class="shell">
      <nav class="rail" id="rail" aria-label="主导航"></nav>
      <main class="main" id="main" tabindex="-1">
        <div id="view-root" class="view" role="region" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="js/app.js"></script>
  <!-- dev mock：仅当 URL 带 mock=1 / dev=1 时由 app.js 动态加载，生产默认不启用 -->
</body>
</html>
