<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>room bridge harness</title></head>
<body>
<iframe id="app" src="/index.html?mock=1" style="width:1100px;height:800px;border:0"></iframe>
<script>
  // 模拟 desktop_shell/src/main.js 的 winefox-ui-room 处理：为每个 action 返回 reply。
  const roomState = {
    state: "online", name: "周末创作室", members: 2, maxMembers: 8,
    localUrl: "http://127.0.0.1:51234/", lanUrl: "http://192.168.1.5:51234/",
    tunnelUrl: "https://frp-hub.com:56494/", verifyWarning: null, error: null,
  };
  window.addEventListener("message", (event) => {
    const d = event.data;
    if (!d || typeof d !== "object") return;
    if (d.type === "winefox-ui-debug") {
      const reply = { type: "winefox-ui-debug-reply", id: d.id, ok: true };
      if (d.action === "getState") reply.state = { enabled: true };
      else if (d.action === "click") reply.enabled = true;
      event.source.postMessage(reply, "*");
    } else if (d.type === "winefox-ui-room") {
      const reply = { type: "winefox-ui-room-reply", id: d.id };
      if (d.action === "getState") { reply.ok = true; reply.state = roomState; }
      else if (d.action === "setTunnel") { reply.ok = true; reply.url = d.url; }
      else if (d.action === "openChatroom") { reply.ok = true; window.__lastOpenChatroom = { nickname: d.nickname, password: d.password }; }
      else if (d.action === "cloudflaredAvailable") { reply.ok = true; reply.available = false; }
      else reply.ok = true;
      event.source.postMessage(reply, "*");
    }
  });
  window.__harnessState = roomState;
</script>
</body>
</html>
