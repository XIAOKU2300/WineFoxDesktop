<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WineFox — 启动</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell-page">
    <div class="brand">
      <div class="logo">W</div>
      <h1>WineFox</h1>
      <p class="sub">本地绘图服务桌面端</p>
    </div>

    <section class="card status-card" id="status-card">
      <div class="status-row">
        <span class="spinner" id="spinner" hidden></span>
        <span class="dot" id="status-dot"></span>
        <h2 id="status-title">正在启动…</h2>
      </div>
      <p class="status-detail" id="status-detail">正在拉起本地 sidecar 服务</p>

      <div class="progress" id="progress-bar"><div class="progress-fill"></div></div>

      <div class="error-box" id="error-box" hidden>
        <h3>错误详情</h3>
        <pre id="error-text"></pre>
        <h3>最近日志（已脱敏）</h3>
        <pre id="log-tail"></pre>
      </div>

      <div class="actions" id="actions">
        <button class="btn primary" id="btn-open" disabled>打开面板</button>
        <button class="btn" id="btn-retry" hidden>重试启动</button>
        <button class="btn ghost" id="btn-quit">退出</button>
      </div>
    </section>

    <footer>版本 <span id="app-version">…</span> · 协议 v1 · sidecar 仅监听 127.0.0.1</footer>
  </main>

  <div class="modal-backdrop" id="exit-modal" hidden>
    <div class="modal">
      <h2>正在生成图片，确认退出？</h2>
      <p>当前有 <b id="exit-task-count">0</b> 个任务在运行。退出时不会打断 ComfyUI 后端，生成任务会继续在后台跑完并丢弃。</p>
      <div class="modal-actions">
        <button class="btn primary" id="exit-wait">等待任务完成（默认）</button>
        <button class="btn" id="exit-now">立即退出</button>
        <button class="btn ghost" id="exit-cancel">返回应用</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
