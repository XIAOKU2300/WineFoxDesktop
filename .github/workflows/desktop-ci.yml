# WineFox Desktop CI — Agent 10 (quality/security gate)
#
# Only the jobs marked [REAL] are runnable against the current repository.
# Every other entry is an explicit GATE/TODO placeholder: it runs ONLY on
# workflow_dispatch with gates=run, and its steps FAIL with a clear
# "GATE PENDING" message instead of pretending to work.
name: desktop-ci

on:
  push:
    branches: [master, main, agent/*]
  pull_request:
  workflow_dispatch:
    inputs:
      gates:
        description: "run NOT-YET-IMPLEMENTED gates (will fail on purpose)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  actions: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  python-unit-tests: # [REAL] existing 54 tests + static checks
    name: Python unit tests (54 existing)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest aiohttp Pillow pyyaml
      - name: Run existing unit tests (tests/)
        run: python -m pytest tests/ -q --no-header
      - name: Compile-check all plugin modules
        run: python -m compileall -q main.py comfyui_api.py civitai_api.py gpt_magic.py watermark.py intent_utils.py features/ comfyui_custom_nodes/

  integration-fake-comfyui: # [REAL] Agent 10 suite against Fake ComfyUI
    name: Integration tests (Fake ComfyUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install aiohttp pytest Pillow pyyaml
      - name: Run Agent 10 integration suite (fake server, no ComfyUI needed)
        run: 'python -m pytest desktop_integration_tests/ -c desktop_integration_tests/pytest.ini --junitxml=reports/integration-junit.xml -o junit_family=xunit2'
      - name: List desktop-gate (pending) coverage
        run: 'python -m pytest desktop_integration_tests/test_api_v1_integration.py -c desktop_integration_tests/pytest.ini -m desktop_gate -rs --no-header -q'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: reports/integration-junit.xml

  verify-tool: # [REAL] desktop_verify.py self-test + JSON emission
    name: desktop_verify.py self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the verifier
        run: python tools/desktop_verify.py --self-test
      - name: Emit a JSON report against the plugin tree (informational)
        continue-on-error: true  # dev tree legitimately contains test tokens & the legacy password schema default
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python tools/desktop_verify.py --root . --json reports/desktop-verify.json --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verify
          path: reports/desktop-verify.json

  sbom: # [REAL] minimal SPDX-ish SBOM from pip metadata (no paid API)
    name: SBOM (Python deps)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SBOM (pip + requirements, JSON)
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          pip install -r requirements.txt --dry-run --report reports/pip-report.json
          python -c "import json; rep=json.load(open('reports/pip-report.json', encoding='utf-8')); deps=rep.get('install', []); sbom={'bomFormat':'SPDX-ish (minimal)','specVersion':'1.0','component':{'type':'application','name':'winefox-desktop','version':'0.1.0'},'dependencies':[{'name':(d.get('metadata') or {}).get('name'),'version':(d.get('metadata') or {}).get('version'),'license':(lambda l: l if isinstance(l, str) else ((l or {}).get('expression') or 'unknown'))((d.get('metadata') or {}).get('license'))} for d in deps]}; json.dump(sbom, open('reports/sbom-python.json','w',encoding='utf-8'), indent=2, ensure_ascii=False); print('SBOM entries:', len(sbom['dependencies']))"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: reports/sbom-python.json

  vuln-scan: # [REAL] pip-audit (free, no API key)
    name: Dependency vulnerability scan (pip-audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements.txt (fail only on audit tool errors; vulns are reported in logs)
        run: |
          pip-audit -r requirements.txt --desc on
          if ($LASTEXITCODE -eq 2) { Write-Error "pip-audit tool error"; exit 2 }
          if ($LASTEXITCODE -eq 1) { Write-Warning "pip-audit found vulnerabilities - see step log" }
          exit 0
      - name: Summary
        run: python -c "print('pip-audit finished (see step log for details)')"

  # ------------------------------------------------------------------ GATES
  # The jobs below are GATE PENDING: the corresponding production modules are
  # being developed by other parallel agents and are NOT merged yet. They never
  # run on push/PR; on workflow_dispatch gates=run they fail on purpose.

  core-gate:
    name: GATE core engine
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: core engine module (Agent 02) not merged yet"'
      - run: 'exit 1'

  backend-gate:
    name: GATE backend /api/v1
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: desktop backend /api/v1 (Agent 07) not merged yet - see desktop_integration_tests/test_api_v1_integration.py"'
      - run: 'exit 1'

  rust-gate:
    name: GATE Rust components
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: Rust workspace (cargo test) not present in this repo yet"'
      - run: 'exit 1'

  frontend-gate:
    name: GATE frontend
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: frontend build (npm ci && npm run build) not present yet"'
      - run: 'exit 1'

  pyinstaller-gate:
    name: GATE PyInstaller packaging
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: PyInstaller spec/entrypoint not merged yet"'
      - run: 'exit 1'

  tauri-nsis-gate:
    name: GATE Tauri NSIS installer
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: Tauri app + NSIS config (Agent 09) not merged yet"'
      - run: 'exit 1'

  install-smoke-gate:
    name: GATE installer smoke test
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: silent-install + launch smoke test needs the NSIS artifact"'
      - run: 'exit 1'

  signed-release-gate:
    name: GATE signed release
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gates == 'true'
    steps:
      - run: 'echo "GATE PENDING: code signing cert + update manifest signing not configured"'
      - run: 'exit 1'

  gate-status:
    name: Gate status summary
    runs-on: ubuntu-latest
    needs: [core-gate, backend-gate, rust-gate, frontend-gate, pyinstaller-gate, tauri-nsis-gate, install-smoke-gate, signed-release-gate]
    if: always()
    steps:
      - name: Print pending gates
        run: |
          echo "Pending gates (not implemented in this repo yet):"
          echo "  - core engine          (Agent 02)"
          echo "  - backend /api/v1      (Agent 07)"
          echo "  - Rust workspace       (Agent 01/02)"
          echo "  - frontend build       (Agent 08)"
          echo "  - PyInstaller bundle   (Agent 09)"
          echo "  - Tauri NSIS installer (Agent 09)"
          echo "  - install smoke test   (Agent 09)"
          echo "  - signed release       (release manager)"
